{% set name = "napari-convpaint" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b5a6e8a665e371a35507bf425582a10c5853a43cec5610210f45434fc5f1a027

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - catboost >=1.2.8
    - dask
    - einops
    - imageio
    - joblib
    - magicgui
    - napari
    - napari-annotation-project
    - napari-guitils >=0.2.0
    - numpy
    - omegaconf
    - pandas
    - platformdirs
    - psutil
    - python >={{ python_min }}
    - pytorch
    - pyyaml
    - qtpy
    - requests
    - scikit-image
    - scikit-learn
    - scipy
    - tifffile
    - timm >=1.0.20
    - torchvision >=0.13.0
    - zarr

test:
  imports:
    - napari_convpaint
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}
    - pyqt

about:
  home: https://pypi.org/project/napari-convpaint
  summary: A plugin for segmentation by pixel classification using convolutional feature extraction
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/guiwitz/napari-convpaint

extra:
  recipe-maintainers:
    - guiwitz
    - jaimergp
